[package]
name = "kortina"
version = "26.5.0-nightly.2"
description = "Kortina IDE"
authors = ["KairoteStudio"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
once_cell = "1.19"
urlencoding = "2.1"
tauri-plugin-opener = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-shell = "2.2"
tauri-plugin-updater = "2.2"
crossterm = "0.27"
ansi-parser = "0.9.0"
regex = "1.10"
portable-pty = "0.8"
shell-words = "1.1.1"
uuid = { version = "1.7", features = ["v4"] }
zip = "2"
glob = "0.3"
chrono = "0.4"
sha2 = "0.10"
notify = "6"
log = "0.4"
env_logger = "0.11"
which = "6"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# 发布构建优化：减少二进制体积、提升启动速度
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
