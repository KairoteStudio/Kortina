name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00 运行
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate version
        id: version
        run: |
          BASE_VERSION=$(jq -r '.version' Kortina/package.json | sed 's/-nightly\..*//' | sed 's/-canary\..*//' | sed 's/-stable\..*//')
          BUILD_NUMBER=${{ github.run_number }}
          DATE=$(date +%Y%m%d)
          VERSION="${BASE_VERSION}-nightly.${BUILD_NUMBER}+${DATE}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            os: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-24.04-arm
            os: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
          - platform: windows-latest
            os: windows
            arch: amd64
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Kortina/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Kortina/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            dpkg-dev \
            rpm \
            libfuse2

      - name: Install npm dependencies
        run: npm ci
        working-directory: ./Kortina

      - name: Update version (package.json)
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          jq --arg v "${VERSION}" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
        working-directory: ./Kortina

      - name: Update version (Cargo.toml)
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
        working-directory: ./Kortina/src-tauri

      - name: Update version (tauri.conf.json)
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          jq --arg v "${VERSION}" '.version = $v' tauri.conf.json > tauri.conf.json.tmp && mv tauri.conf.json.tmp tauri.conf.json
        working-directory: ./Kortina/src-tauri

      - name: Build with Tauri
        id: tauri-build
        run: npx @tauri-apps/cli build --target ${{ matrix.target }} --verbose --config '{"bundle":{"createUpdaterArtifacts":false}}'
        working-directory: ./Kortina
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug build output
        shell: bash
        run: |
          echo "=== target dir ==="
          ls Kortina/src-tauri/target/${{ matrix.target }}/release/ 2>/dev/null || echo "target-specific release dir not found"
          echo "=== default release dir ==="
          ls Kortina/src-tauri/target/release/ 2>/dev/null || echo "default release dir not found"
          echo "=== bundle dir ==="
          find Kortina/src-tauri/target/ -path "*/bundle/*" -type f 2>/dev/null || echo "no bundle files found"
          echo "=== all binaries ==="
          find Kortina/src-tauri/target/ -name "kortina" -o -name "kortina.exe" 2>/dev/null || echo "no binary found"
          echo "=== full tree (depth 3) ==="
          find Kortina/src-tauri/target/ -maxdepth 3 -type d 2>/dev/null | head -50 || echo "target dir not found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kortina-nightly-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            Kortina/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            Kortina/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            Kortina/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            Kortina/src-tauri/target/release/bundle/**/*.deb
            Kortina/src-tauri/target/release/bundle/**/*.rpm
            Kortina/src-tauri/target/release/bundle/**/*.AppImage
            Kortina/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            Kortina/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 7

  build-flatpak:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Kortina/package-lock.json

      - name: Install jq
        run: |
          dnf install -y jq

      - name: Install npm dependencies
        run: npm ci
        working-directory: ./Kortina

      - name: Update version (package.json)
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          jq --arg v "${VERSION}" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
        working-directory: ./Kortina

      - name: Update version (Cargo.toml)
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
        working-directory: ./Kortina/src-tauri

      - name: Update version (tauri.conf.json)
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          jq --arg v "${VERSION}" '.version = $v' tauri.conf.json > tauri.conf.json.tmp && mv tauri.conf.json.tmp tauri.conf.json
        working-directory: ./Kortina/src-tauri

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Kortina-nightly.flatpak
          manifest-path: .github/flatpak/org.kairotestudio.kortina.yml
          cache: true

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: kortina-nightly-flatpak
          path: Kortina-nightly.flatpak
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, build, build-flatpak]
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: kortina-nightly-*

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build ${{ needs.version.outputs.version }}
          body: |
            Automated nightly build from ${{ github.sha }}.
            
            **Version:** ${{ needs.version.outputs.version }}
            **Channel:** Nightly
            
            **Platforms:**
            - Linux amd64 (.deb, .rpm, .AppImage, .flatpak)
            - Linux arm64 (.deb, .rpm, .AppImage, .flatpak)
            - Windows amd64 (.exe)
            
            > **Note:** Nightly builds are experimental and may contain bugs.
          draft: false
          prerelease: true
          files: artifacts/**/*.{deb,rpm,AppImage,exe,flatpak}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-endpoint:
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate updater endpoint
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          cat > latest-nightly.json << EOF
          {
            "version": "${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/nightly/kortina-nightly-linux-amd64.deb"
              },
              "linux-aarch64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/nightly/kortina-nightly-linux-arm64.deb"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/nightly/kortina-nightly-windows-amd64.exe"
              }
            }
          }
          EOF
          echo "Generated latest-nightly.json"

      - name: Upload updater endpoint to release
        run: |
          gh release upload nightly latest-nightly.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}