app-id: org.kairotestudio.kortina
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable
command: kortina
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --allow=bluetooth
  - --socket=pcsc
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  share-network: true
  env:
    NPM_CONFIG_CACHE: /run/build/kortina/.npm-cache
    CARGO_HOME: /run/build/kortina/.cargo
    CARGO_NET_OFFLINE: 'false'
    CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
modules:
  - name: kortina
    buildsystem: simple
    build-commands:
      - |
        export PATH="/usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin:$PATH"
        export HOME=/run/build/kortina
        cd Kortina
        npm ci --cache /run/build/kortina/.npm-cache --prefer-offline
        npm run build
        cd src-tauri
        cargo fetch
        cargo build --release
        mkdir -p /app/bin
        cp target/release/kortina /app/bin/
        mkdir -p /app/share/applications
        cat > /app/share/applications/org.kairotestudio.kortina.desktop << EOF
        [Desktop Entry]
        Name=Kortina
        Comment=Kortina IDE
        Exec=kortina
        Icon=org.kairotestudio.kortina
        Type=Application
        Categories=Development;IDE;
        EOF
        mkdir -p /app/share/icons/hicolor/256x256/apps
        cp src-tauri/icons/256x256.png /app/share/icons/hicolor/256x256/apps/org.kairotestudio.kortina.png
    sources:
      - type: git
        url: https://github.com/KairoteStudio/Kortina.git
        tag: nightly